<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!--
      ZONE REMPLACÉE AU PRÉRENDU.

      `scripts/prerender.mjs` remplace tout ce qui se trouve entre ces deux
      marqueurs par les métadonnées propres à chaque URL : titre, description,
      canonique, Open Graph et graphe schema.org.

      Ce qui suit est donc le repli de développement, et ce que verrait un
      visiteur si le prérendu venait à ne pas tourner. Ne rien écrire ici qui
      décrive un album en particulier : ce document sert quinze pages.
    -->
    <!--seo-start-->
    <title>Grafenberg — Dark synthwave &amp; industrial electronics</title>
    <meta
      name="description"
      content="The complete Grafenberg discography: ten albums of dark synthwave and industrial electronics, including two collaborations with Broken Shaman. Listen on SoundCloud and Bandcamp."
    />
    <meta property="og:site_name" content="Grafenberg" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.grafenberg.ovh/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://www.grafenberg.ovh/" />
    <!--seo-end-->

  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
