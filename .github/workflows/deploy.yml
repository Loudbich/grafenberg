name: Deploy to GitHub Pages

# Uniquement sur main. Le déclencheur `pull_request` d'origine lançait un
# déploiement Pages depuis chaque PR — un job qui ne peut pas aboutir, puisque
# l'environnement Pages n'accepte que la branche par défaut.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # 22 et non 18 : `npm run sync` importe le manifeste TypeScript
        # directement, ce que Node ne sait faire qu'à partir de 22.18.
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4